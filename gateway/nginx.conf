events { worker_connections 1024; }
http {
    server {
        listen 80;
        
        # Custom Error Pages for Gateway (returning JSON format)
        error_page 401 = @error401;
        error_page 403 = @error403;

        location @error401 {
            return 401 '{"status":-1,"data":[],"messages":["請先登入後再操作。"],"error":{"code":"unauthorized","fields":[]}}';
            add_header Content-Type application/json;
        }

        location @error403 {
            return 403 '{"status":-1,"data":[],"messages":["您沒有執行此操作的權限。"],"error":{"code":"forbidden","fields":[]}}';
            add_header Content-Type application/json;
        }

        # Internal Auth Verification for Gateway
        location = /api/auth/verify {
            internal;
            proxy_pass http://user-service:8000/api/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Accept application/json;
        }

        # Route to User Service (Public Auth & Users)
        location /api/users {
            proxy_pass http://user-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/auth {
            proxy_pass http://user-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/admin {
            proxy_pass http://user-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route to Order Service (Protected with API Gateway auth_request)
        location /api/orders {
            auth_request /api/auth/verify;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_roles $upstream_http_x_user_roles;
            auth_request_set $user_venues $upstream_http_x_user_venues;

            proxy_pass http://order-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Inject verification headers to downstream service
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Roles $user_roles;
            proxy_set_header X-User-Venues $user_venues;
        }

        # Root Fallback
        location / {
            return 200 '{"gateway": "U-Badminton API Gateway", "status": "Online"}';
            add_header Content-Type application/json;
        }
    }
}
