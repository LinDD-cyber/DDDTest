server {
    listen 80;
    server_name localhost;

    # Log configuration
    access_log /var/log/nginx/gateway_access.log;
    error_log /var/log/nginx/gateway_error.log;

    # 1. User Service - Authentication & Verification Routes
    location /api/auth {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. User Service - User & Admin Management
    location /api/users {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Order Service - Protected Routes (Checked via Gateway Auth)
    location /api/orders {
        auth_request /internal-auth-verify;

        # Retrieve headers returned from the auth subrequest
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_user_roles $upstream_http_x_user_roles;
        auth_request_set $auth_user_venues $upstream_http_x_user_venues;

        # Inject these headers into the request forwarded to order-service
        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-User-Roles $auth_user_roles;
        proxy_set_header X-User-Venues $auth_user_venues;

        proxy_pass http://order-service:8000;
        proxy_set_header Host $host;
        proxy_set_header Accept "application/json";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal Authentication Verification Subrequest
    location = /internal-auth-verify {
        internal;
        proxy_pass http://user-service:8000/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        
        # Force JSON response from user-service to prevent redirect to non-existent 'login' route
        proxy_set_header Accept "application/json";
        
        # Pass the incoming authorization header (Bearer token)
        proxy_set_header Authorization $http_authorization;
    }
}
