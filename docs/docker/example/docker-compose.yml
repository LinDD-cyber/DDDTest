  nginx:
    container_name: example_nginx
    image: nginx:1.26.2
    build: nginx
    restart: unless-stopped
    tty: true
    ports:
      - "80:80"
    volumes:
      - ../../code:/var/www/html/example
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - php
  mariadb:
    container_name: example_mariadb
    image: mariadb:11.8_withBackup
    build: mariadb
    restart: always
    tty: true
    ports:
      - "3306:3306"
    volumes:
      - /var/lib/mysql_example:/var/lib/mysql
      - ./mariadb/my.cnf:/etc/mysql/my.cnf
      - ./mariadb/script:/script
      - ./mariadb/backup:/backup
    command: --character-set-server=utf8
    environment:
      - MYSQL_ROOT_PASSWORD=root@example251113
      - MYSQL_DATABASE=example
      - MYSQL_USER=ai4dt
      - MYSQL_PASSWORD=ai4dt@example
  php:
    container_name: example_php
    image: php:8.4-fpm_v20251113
    build: php
    restart: always
    tty: true
    volumes:
      - ./../../code:/var/www/html/example
    depends_on:
      - mariadb