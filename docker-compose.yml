services:
  # =========================
  # API Gateway
  # =========================
  gateway:
    build:
      context: ./gateway
    ports:
      - "8080:80"
    depends_on:
      - user-service
      - order-service
    restart: unless-stopped
    networks:
      - dddtest-network

  # =========================
  # User Service
  # =========================
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    volumes:
      - ./services/user-service:/app
      - ./shared:/shared
      - user-vendor:/app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: user_db
      DB_USERNAME: root
      DB_PASSWORD: root@0000

      REDIS_HOST: redis
      REDIS_PORT: 6379

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    restart: unless-stopped
    networks:
      - dddtest-network

  # =========================
  # Order Service
  # =========================
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    depends_on:
      - user-service
    volumes:
      - ./services/order-service:/app
      - ./shared:/shared
      - order-vendor:/app/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      USER_SERVICE_URL: http://user-service:8000

      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: order_db
      DB_USERNAME: root
      DB_PASSWORD: root@0000

      REDIS_HOST: redis
      REDIS_PORT: 6379

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    restart: unless-stopped
    networks:
      - dddtest-network

volumes:
  user-vendor:
  order-vendor:

networks:
  dddtest-network:
    external: true